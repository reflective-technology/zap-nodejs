name: "Reviewdog"
on:
  pull_request:
    branches: ["main"]
permissions:
  contents: read
  pull-requests: write
jobs:
  detect-secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Run detect-secrets
        uses: reviewdog/action-detect-secrets@d4720f862b52060d151f232944d0f6151eea9a9f
        with:
          reporter: "github-pr-review"
  eslint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.x
          cache: "npm"
      - name: Install dependencies
        run: npm install
      - name: Run ESLint
        uses: reviewdog/action-eslint@3ee2a450da17e060b9dfa4bffd53976906c6b2b0
        with:
          reporter: "github-pr-review"
