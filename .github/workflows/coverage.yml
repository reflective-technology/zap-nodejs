name: Code Coverage

permissions:
  contents: read
  pull-requests: write

on:
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.x
          cache: "npm"
      - name: Install dependencies
        run: npm i
      - name: Run coverage
        run: npm run coverage
        env:
          CI: true
      - name: "Report Coverage"
        if: always()
        uses: davelosert/vitest-coverage-report-action@8f86cfb56ed6d5613ea8cdc5259f207fbfd51ece
