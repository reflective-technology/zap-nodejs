name: Release
on:
  push:
    branches:
      - main
    paths:
      - "package.json"
jobs:
  version:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      value: ${{ steps.get_version.outputs.value }}
      tagged: ${{ steps.tagged.outputs.tagged }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Extract version from package.json
        uses: sergeysova/jq-action@a3f0d4ff59cc1dddf023fc0b325dd75b10deec58
        id: get_version
        with:
          cmd: "jq .version package.json -r"
      - name: "Check: if the version has corresponding git tag"
        id: tagged
        shell: bash
        run: |
          git show-ref --tags --verify --quiet -- "refs/tags/v${{ steps.get_version.outputs.value }}" &&
          echo "tagged=0" >> $GITHUB_OUTPUT ||
          echo "tagged=1" >> $GITHUB_OUTPUT
  tag:
    runs-on: ubuntu-latest
    needs: version
    if: needs.version.outputs.value != '0.0.0' && needs.version.outputs.tagged == '1'
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Generate a token
        id: generate-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510
        with:
          client-id: ${{ vars.TAG_GITHUB_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
      - name: Push tag
        id: tag_version
        uses: reflective-technology/github-tag-action@85675313df09822536e1584a675156d2b96779fa
        with:
          github_token: ${{ steps.generate-token.outputs.token }}
          tag_prefix: "v"
          custom_tag: ${{ needs.version.outputs.value }}
      - uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd #v1.21.0
        with:
          immutableCreate: true
          makeLatest: ${{ !contains(needs.version.outputs.value, 'rc') }}
          prerelease: ${{ contains(needs.version.outputs.value, 'rc') }}
          generateReleaseNotes: true
          skipIfReleaseExists: true
          tag: ${{ steps.tag_version.outputs.new_tag }}
          name: Release ${{ steps.tag_version.outputs.new_tag }}
          body: ${{ steps.tag_version.outputs.changelog }}
  publish:
    runs-on: ubuntu-latest
    needs: version
    if: needs.version.outputs.value != '0.0.0' && needs.version.outputs.tagged == '1'
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Use Node.js version 24.x
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.x
      - name: Install dependencies
        run: npm install
      - name: Build package
        run: npm run build
      - name: Update npm
        run: npm install -g npm@latest
      - name: Publish package
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
